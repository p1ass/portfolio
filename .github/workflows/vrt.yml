name: VRT

on:
  pull_request:

jobs:
  playwright-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # イメージのバージョンを @playwright/test に追従させる。ずれるとブラウザが起動しない。
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  vrt:
    needs: playwright-version
    # Apple Silicon の手元とアーキテクチャを揃える。amd64 だと手元では qemu のエミュレーションになり、遅いうえに落ちる。
    runs-on: ubuntu-24.04-arm
    # 基準画像はこのイメージの中で撮る。ローカルからは vrt/docker-run.sh が同じイメージを使うので、フォントのレンダリングが一致する。
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # ロックファイルを作ったバージョンに合わせる。別のバージョンで入れると、触っていない pnpm-lock.yaml まで書き換わる。
          version: 10.8.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # 素の Playwright イメージには和文フォントが無く、sans-serif が中国語のフォントに解決される。基準画像を撮る前に固定する。
      - name: Install fonts
        run: ./vrt/install-fonts.sh
      - run: pnpm build
      - name: Run visual regression tests
        run: pnpm exec playwright test
      - name: Upload diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diff
          path: vrt/.results
          include-hidden-files: true
          retention-days: 7
