name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # pnpm 11 は package.json の pnpm.overrides を読まず、ロックファイルと食い違って install が落ちるので、ロックファイルを作った版に合わせる。
          version: 10.8.0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint
