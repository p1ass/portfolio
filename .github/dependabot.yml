version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # ブラウザの版が上がると描画が変わり、基準画像の更新が要ることがある。ほかの更新を巻き込んで止めないよう分ける。先に一致したグループに入るので先頭に置く。
      playwright:
        patterns:
          - "@playwright/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
